name: Dependency Gate (PR Advisory)

on:
  pull_request:
    branches:
      - main
    paths:
      - 'bricks/project/__brick__/pubspec.yaml'

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  check-deps:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Dart
        uses: dart-lang/setup-dart@v1

      - name: Install Tool Dependencies
        run: cd tool && dart pub get

      - name: Run Dependency Gate
        id: gate
        run: |
          # This script will exit 0 in both success and "failure" cases because it is advisory only.
          # It prints the markdown table to stdout.
          dart run tool/check_deps.dart --mode=gate > advisory.md

      - name: Post PR Comment
        uses: actions/github-script@v7
        if: always()
        with:
          script: |
            const fs = require('fs');
            if (!fs.existsSync('advisory.md')) {
              console.log("No advisory.md found.");
              return;
            }
            const advisory = fs.readFileSync('advisory.md', 'utf8');
            console.log("Advisory content length:", advisory.length);
            console.log("Advisory content preview:", advisory.substring(0, 100));
            
            if (process.env.GITHUB_STEP_SUMMARY) {
              fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, advisory + '\n');
            }
            
            if (advisory.includes('⚠️')) {
              console.log("Found warning emoji, attempting to post comment to PR...");
              try {
                await github.rest.issues.createComment({
                  issue_number: context.issue.number,
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  body: advisory
                });
                console.log("Successfully posted PR comment.");
              } catch (error) {
                console.warn("Could not post PR comment (read-only token or fork PR):", error.message);
              }
            } else {
              console.log("No warning emoji found in the advisory.");
            }
