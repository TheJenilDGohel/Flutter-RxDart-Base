name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  smoke-test:
    name: Brick Generation Smoke Test (Flutter ${{ matrix.flutter }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # Latest stable we test on, and the minimum we claim to support.
        # The minimum leg catches SDK floors set higher than dependencies need.
        flutter: ['3.47.9', '3.47.8']
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: ${{ matrix.flutter }}

      - name: Install tool dependencies
        working-directory: tool
        run: dart pub get

      - name: Run Smoke Test
        run: dart run tool/smoke.dart

  platform-builds:
    name: Build the generated app (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: apk
            os: ubuntu-latest
          - target: ios
            os: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Java (Gradle)
        if: matrix.target == 'apk'
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.47.9'

      - name: Install tool dependencies
        working-directory: tool
        run: dart pub get

      # The smoke test's generated app, then a debug build for the platform:
      # proves the Gradle / Xcode projects and plugins the template brings.
      - name: Generate, check and build
        run: dart run tool/smoke.dart --build ${{ matrix.target }}

  claude-mods:
    name: Claude Code mods (tests + strict validation)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code@2.1.319

      - name: Test and validate each mod
        run: |
          for mod in bricks/harness/__brick__/.claude/plugins/*/; do
            [ -f "$mod/.claude-plugin/plugin.json" ] || continue
            echo "::group::$mod"
            (cd "$mod" && claude plugin test && claude plugin validate --strict .)
            echo "::endgroup::"
          done

      - name: Validate both marketplaces
        run: |
          claude plugin validate --strict .
          claude plugin validate --strict bricks/harness/__brick__/.claude/plugins

  docs-check:
    name: Docs Link Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Dart
        uses: dart-lang/setup-dart@v1

      - name: Install tool dependencies
        working-directory: tool
        run: dart pub get

      - name: Run Docs Check
        run: dart run tool/docs_check.dart

  packages-lint-test:
    name: Packages Test (redux_rxdart_lints)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.47.9'

      - name: Install dependencies
        working-directory: packages/redux_rxdart_lints
        run: dart pub get

      - name: Format
        working-directory: packages/redux_rxdart_lints
        run: dart format --set-exit-if-changed lib

      - name: Analyze
        working-directory: packages/redux_rxdart_lints
        run: dart analyze --fatal-infos

      # Fixture project: every rule has expect_lint positives and clean
      # negatives. Fails on a missing or an unexpected lint.
      - name: Rule fixtures
        working-directory: packages/redux_rxdart_lints
        run: dart run tool/check_fixture.dart

  adaptive-units:
    name: Packages Test (adaptive_units, Flutter ${{ matrix.flutter }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        flutter: ['3.47.9', '3.38.10']
    defaults:
      run:
        working-directory: packages/adaptive_units
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: ${{ matrix.flutter }}

      - name: Install dependencies
        run: flutter pub get

      - name: Format
        run: dart format --set-exit-if-changed lib test example

      - name: Analyze
        run: dart analyze --fatal-infos

      - name: Test
        run: flutter test

      - name: Publish dry run
        run: dart pub publish --dry-run

  workspace-checks:
    name: Workspace format & analyze (tool, hooks)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.47.9'

      - name: Resolve dependencies
        run: |
          for d in tool bricks/project/hooks bricks/bloc/hooks; do
            (cd "$d" && dart pub get)
          done

      - name: Format
        run: dart format --set-exit-if-changed tool bricks/project/hooks bricks/bloc/hooks bricks/harness/__brick__/scripts/agent

      - name: Analyze
        run: dart analyze --fatal-infos tool bricks/project/hooks bricks/bloc/hooks bricks/harness/__brick__/scripts/agent

      - name: Harness docs reference only real code
        run: dart run tool/harness_check.dart

      - name: Harness learning loop end-to-end
        run: dart run tool/test_harness_learn.dart
      - name: Harness size budget
        run: dart run tool/test_harness_budget.dart

      - name: Harness upgrade end-to-end
        run: |
          dart pub global activate mason_cli
          mason get
          dart run tool/test_harness_upgrade.dart

      # Compliance gate: brick budget, mods wired and enabled, root
      # marketplace serves the brick copies, on_edit/loop guard behaviour.
      - name: Harness evaluation gates
        run: dart run tool/eval.dart

      # Generated app: hostile edits caught, wire_route, full verify.dart.
      - name: Harness adversarial end-to-end
        run: dart run tool/adversarial_test.dart
