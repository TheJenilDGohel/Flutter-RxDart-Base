name: harness
description: >-
  Scaffolds an Autonomous AI Agent Harness into any Flutter project:
  AGENTS.md universal cognitive contract, CLAUDE.md native import,
  .agents/skills/ universal senior-dev skill (mirrored to .cursor/skills/),
  and scripts/agent/ deterministic CLI verification and route wiring tools.
version: 1.4.2

environment:
  mason: ">=0.1.0-dev.52 <0.2.0"

vars:
  project_name:
    type: string
    description: Project name in snake_case
    default: app
  android_package_name:
    type: string
    description: Android package name
    default: com.example.app
  ios_bundle_id:
    type: string
    description: iOS bundle identifier
    default: com.example.app
