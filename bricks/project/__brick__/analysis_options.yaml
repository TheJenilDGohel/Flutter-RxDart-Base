include: package:flutter_lints/flutter.yaml

analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  errors:
    missing_required_param: error
    missing_return: error
    todo: ignore
    unrecognized_error_code: ignore
{{#include_harness}}

# Architecture golden rules (AGENTS.md), run by `flutter analyze`, the IDE and
# verify.dart. A git plugin source needs Dart 3.13 / Flutter 3.47 or newer;
# older SDKs skip it silently. Restart the analysis server after editing.
# fork-url: the fork until upstream (TheJenilDGohel) merges lints 0.4.0.
plugins:
  redux_rxdart_lints:
    git:
      url: https://github.com/jenilseawind-glitch/Flutter-RxDart-Base.git
      path: packages/redux_rxdart_lints
      ref: main
{{/include_harness}}

linter:
  rules:
    - prefer_single_quotes
    - unawaited_futures
    - close_sinks
    - cancel_subscriptions
    - avoid_print
    - always_declare_return_types
    - prefer_final_locals
    - prefer_const_constructors
    - prefer_const_declarations
    - avoid_empty_else
    - avoid_relative_lib_imports
    - empty_catches
    - no_duplicate_case_values
    - use_super_parameters
