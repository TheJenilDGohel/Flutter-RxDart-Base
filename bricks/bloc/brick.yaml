name: bloc
description: >-
  Generates a feature folder under lib/features/ with BLoC (RxDart), repository (injectable),
  response model, content widget, and page.
  Run once per feature/screen.
version: 1.1.0

environment:
  mason: ">=0.1.0-dev.52 <0.2.0"

vars:
  feature_name:
    type: string
    description: Feature name in snake_case
    prompt: "Feature name in snake_case (e.g. user_profile):"
